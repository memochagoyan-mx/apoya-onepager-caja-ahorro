:root{--ink:#191919;--paper:#F3F3F3;--teal:#4AAEBF;--indigo:#4F55AB;--yellow:#E8D24F;--card:#fff;--soft:#e3e3e3;--ph:#e9e9ef;--phl:#9aa0b8;--sidetxt:#fff;--zc:#d13b8a;--dur:.4s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'Albert Sans',sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);display:flex;overflow:hidden}
ul{list-style:none}
.side{width:660px;background:var(--indigo);color:#fff;padding:48px 56px 50px;display:flex;flex-direction:column;flex:none}
.side h1{font-size:56px;line-height:1.05;font-weight:700}
.sub{font-size:30px;font-weight:700;color:var(--yellow);margin-top:24px;line-height:1.2}
.s1c{margin-top:auto;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end}
.stats{display:flex;flex-direction:column;gap:26px}
.stats div{font-size:92px;font-weight:700;line-height:.95;letter-spacing:-1px}
.stats small{display:block;font-size:28px;font-weight:400;margin-top:8px;letter-spacing:0;color:var(--yellow)}
.solp{display:flex;flex-direction:column;gap:20px}
.sl{font-size:30px;font-weight:700;color:var(--yellow);letter-spacing:.5px}
.si b{display:block;font-size:30px;line-height:1.1}
.si span{display:block;font-size:24px;line-height:1.25;margin-top:4px;color:#e8e9f7}
.pnav{display:flex;align-items:center;gap:12px;margin-top:26px}
.pd{margin-right:auto}
.pd i,.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;cursor:pointer}
.pd i{background:rgba(255,255,255,.35);margin-right:8px}.pd i.on{background:#fff}
.par{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--indigo);display:inline-flex;align-items:center;justify-content:center;font-size:32px;line-height:1;padding-bottom:4px;font-weight:700;cursor:pointer;user-select:none;border:0}
.certp{border-top:2px solid rgba(255,255,255,.6);margin-top:18px;height:50px;flex:none;padding-top:14px;font-size:24px;line-height:28px}
.main{flex:1;padding:48px 56px 50px 48px;display:flex;flex-direction:column;gap:18px;min-width:0;position:relative}
.card{background:var(--card);border-radius:20px;padding:18px 22px;position:relative}
h2{font-size:28px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:center}
h2 i{font-style:normal;background:var(--ink);color:#fff;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
.grp{font-size:24px;font-weight:700;color:var(--indigo);margin-left:18px}
.nav{margin-left:auto;display:flex;align-items:center;gap:12px}
.dots i{background:rgba(25,25,25,.25);margin-left:6px}.dots i.on{background:var(--indigo)}
.ar{width:44px;height:44px;border-radius:50%;background:var(--indigo);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:32px;line-height:1;padding-bottom:4px;cursor:pointer;user-select:none;border:0}
.ar:hover,.par:hover{transform:scale(1.08)}
.tg{height:282px;flex:none}
.tg p{font-size:26px;line-height:1.3;max-width:1112px}
.nolw{display:grid;grid-template-columns:1fr 1fr;gap:40px}.nol li{font-size:26px;line-height:1.3;margin-bottom:8px;padding-left:18px;position:relative}
.nol li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--indigo)}
.ba{flex:1;display:flex;flex-direction:column;min-height:0}
.bwrap{display:flex;gap:28px;margin-top:8px;flex:1;min-height:0}
.ph{position:relative;width:520px;background:var(--ph);border:2px dashed var(--phl);border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph line{stroke:#c3c6d6;stroke-width:.6;vector-effect:non-scaling-stroke}
.ph.pic{border:0;background-size:cover;background-position:center}.ph.pic svg,.ph.pic span{display:none}
.ph span{position:relative;font-weight:700;font-size:22px;text-align:center;color:#5a5f80;background:var(--ph);padding:6px 14px;border-radius:8px}
.bl{flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:space-around}
.bl li{font-size:24px;line-height:1.28;padding:10px 0;border-top:1px solid var(--soft)}
.bl li:first-child{border-top:none}
.f1{border-top:2px solid var(--ink);padding-top:14px;height:50px;display:flex;justify-content:space-between;align-items:flex-start;font-size:24px;line-height:28px;flex:none}
.f1 span{font-size:24px}

/* espacios comunes (v0.4) */
.card{padding:22px 30px}
.bwrap{gap:40px}
.tg h2,.ba h2{margin-bottom:12px}
.nolw{gap:48px}
.bl li{padding-left:2px;padding-right:4px}
/* PIEL 1 · Contorno negro */
html[data-skin=contorno] #stage{background:#191919}
html[data-skin=contorno] .card{background:transparent;border:1px solid #444}
html[data-skin=contorno] h2,html[data-skin=contorno] .tg p,html[data-skin=contorno] .nol li,html[data-skin=contorno] .bl li,html[data-skin=contorno] .f1,html[data-skin=contorno] .f1 b,html[data-skin=contorno] .f1 span{color:#fff}
html[data-skin=contorno] .bl li{border-top-color:#3d3d3d}
html[data-skin=contorno] .dots i{background:rgba(255,255,255,.28)}
html[data-skin=contorno] .dots i.on{background:#E8D24F}
html[data-skin=contorno] .f1{border-top-color:#fff}
html[data-skin=contorno] .grp{color:#E8D24F}
html[data-skin=contorno] .ar{background:#E8D24F;color:#191919}
html[data-skin=contorno] h2 i{background:#4AAEBF;color:#191919}
html[data-skin=contorno] .nol li:before{background:#E8D24F}
html[data-skin=contorno] .ph.pic{box-shadow:0 0 0 1px #3d3d3d}
/* sin cajas (pieles 2 y 3) */
html[data-skin=claro] .card,html[data-skin=negro] .card{background:transparent;border:0;border-radius:0;padding:22px 0}
html[data-skin=claro] .ba.card,html[data-skin=negro] .ba.card{padding-top:26px}
/* PIEL 2 · Claro integrado */
html[data-skin=claro] #stage{background:#F3F3F3}
html[data-skin=claro] .ba.card{border-top:1px solid #c9c9c9}
/* PIEL 3 · Negro integrado */
html[data-skin=negro] #stage{background:#191919}
html[data-skin=negro] .ba.card{border-top:1px solid #444}
html[data-skin=negro] h2,html[data-skin=negro] .tg p,html[data-skin=negro] .nol li,html[data-skin=negro] .bl li,html[data-skin=negro] .f1,html[data-skin=negro] .f1 b,html[data-skin=negro] .f1 span{color:#fff}
html[data-skin=negro] h2 i{background:#E8D24F;color:#191919}
html[data-skin=negro] .grp{color:#4AAEBF}
html[data-skin=negro] .nol li:before{background:#4AAEBF}
html[data-skin=negro] .bl li{border-top-color:#3d3d3d}
html[data-skin=negro] .dots i{background:rgba(255,255,255,.28)}
html[data-skin=negro] .dots i.on{background:#E8D24F}
html[data-skin=negro] .f1{border-top-color:#fff}
/* control discreto de piel y calibracion (no es parte del producto) */
#dev{left:10px;bottom:10px;transform:none;align-items:center;opacity:.12;transition:opacity .25s}
#dev:hover,#dev:focus-within{opacity:1}
#skins{display:flex;gap:8px;align-items:center}
#dev #skins button{width:18px;height:18px;padding:0;border-radius:50%;border:2px solid #888;cursor:pointer}
#dev #skins button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #E8D24F}
#dev #skins button[data-skin=contorno]{background:#191919;border-color:#E8D24F}
#dev #skins button[data-skin=claro]{background:#F3F3F3;border-color:#4F55AB}
#dev #skins button[data-skin=negro]{background:#000;border-color:#4AAEBF}
/* animación */
.anim{transition:opacity var(--dur) ease,transform var(--dur) ease}
.anim.out{opacity:0;transform:translateX(-28px)}
.anim.in0{opacity:0;transform:translateX(28px);transition:none}
@media (prefers-reduced-motion:reduce){.anim{transition:none}}
/* herramientas de calibración (no son parte del producto) */
#dev{position:fixed;left:10px;bottom:10px;display:flex;gap:10px;z-index:99}
#dev button{font:700 14px 'Albert Sans',sans-serif;padding:8px 16px;border-radius:999px;border:1px solid #888;background:rgba(255,255,255,.92);color:#191919;cursor:pointer}
.stamp{position:absolute;right:14px;bottom:6px;font-size:13px;color:#777;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;z-index:5;display:none}
body.codes .stamp,body.shot .stamp{display:block}
body.codes [data-code]{outline:1px dashed var(--zc);outline-offset:-1px;position:relative}
body.codes [data-code]::after{content:attr(data-code);position:absolute;left:0;top:-15px;background:var(--zc);color:#fff;font:700 13px/1 'Albert Sans',sans-serif;padding:3px 6px;border-radius:6px 6px 0 0;z-index:50;letter-spacing:0;text-transform:none;pointer-events:none}
body.codes .ph[data-code]::after{z-index:50}
body.codes #z1[data-code]::after,body.codes .card[data-code]::after,body.codes .f1[data-code]::after{top:0;border-radius:0 0 6px 0}body.codes [data-z=Z1]{--zc:#b8860b}body.codes [data-z=Z2]{--zc:#d13b8a}body.codes [data-z=Z3]{--zc:#1f9d55}body.codes [data-z=Z4]{--zc:#e0701a}
</style>

var st={z1:0,z2:0,z3:0};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function dots(n,i,fn){var h='';for(var k=0;k<n;k++)h+='<i class="'+(k==i?'on':'')+'" data-d="'+fn+k+'"></i>';return h}
function r1(){var s=D.side[st.z1],h='';
 if(s.k=='nums'){h='<div class="stats">'+s.items.map(function(x){return '<div>'+esc(x[0])+'<small>'+esc(x[1])+'</small></div>'}).join('')+'</div>'}
 else{h='<div class="solp"><div class="sl">La solución</div>'+s.items.map(function(x){return '<div class="si"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'}).join('')+'</div>'}
 document.getElementById('s1c').innerHTML=h;
 document.getElementById('pd').innerHTML=dots(2,st.z1,'a')}
function r2(){var q=D.que[st.z2];
 document.getElementById('qt').textContent=q.t;
 var li=function(a){return '<ul class="nol">'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
 document.getElementById('qb').innerHTML=q.p?'<p>'+esc(q.p)+'</p>':'<div class="nolw">'+li(q.l.slice(0,3))+li(q.l.slice(3))+'</div>';
 document.getElementById('qd').innerHTML=dots(2,st.z2,'b')}
function r3(){var b=D.ben[st.z3];
 document.getElementById('bg').textContent=b.g;
 document.getElementById('bl').innerHTML=b.l.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
 var im=document.getElementById('bimg');im.setAttribute('role','img');im.setAttribute('aria-label',b.img);
 if(b.src){im.classList.add('pic');im.style.backgroundImage='url('+b.src+')';im.innerHTML=''}else{im.classList.remove('pic');im.style.backgroundImage='';im.innerHTML='<svg viewBox="0 0 100 60" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="60"/><line x1="100" y1="0" x2="0" y2="60"/></svg><span>IMAGEN<br>'+esc(b.img)+'</span>'}
 document.getElementById('bd').innerHTML=dots(2,st.z3,'c')}
var Z={1:{k:'z1',ids:['s1c'],f:r1},2:{k:'z2',ids:['qt','qb'],f:r2},3:{k:'z3',ids:['bg','bl','bimg'],f:r3}};
var busy={};
function go(z,to){var c=Z[z];to=((to%2)+2)%2;if(to==st[c.k]||busy[z])return;busy[z]=1;
 var els=c.ids.map(function(i){return document.getElementById(i)});
 els.forEach(function(e){e.classList.add('out')});
 setTimeout(function(){st[c.k]=to;c.f();
  els.forEach(function(e){e.classList.remove('out');e.classList.add('in0')});
  void els[0].offsetWidth;
  els.forEach(function(e){e.classList.remove('in0')});
  setTimeout(function(){busy[z]=0},400)},400)}
document.addEventListener('click',function(e){var t=e.target;
 ['1','2','3'].forEach(function(z){var a=t.getAttribute&&t.getAttribute('data-z'+z);if(a)go(+z,st[Z[z].k]+(+a))});
 var d=t.getAttribute&&t.getAttribute('data-d');if(d){var m={a:1,b:2,c:3}[d[0]];go(m,+d.slice(1))}});
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight'||e.key=='ArrowLeft'){var s=e.key=='ArrowRight'?1:-1;[1,2,3].forEach(function(z){go(z,st[Z[z].k]+s)})}});
r1();r2();r3();
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);var st=document.getElementById('stage').style;st.transform='scale('+s+')';st.left=((innerWidth-1920*s)/2)+'px';st.top=((innerHeight-1080*s)/2)+'px'}
addEventListener('resize',fit);fit();
var SK=['contorno','claro','negro'];
function setSkin(n){document.documentElement.setAttribute('data-skin',n);
 [].forEach.call(document.querySelectorAll('#skins button'),function(b){b.classList.toggle('on',b.getAttribute('data-skin')==n)});
 try{localStorage.setItem('apoya-skin',n)}catch(e){}}
var saved=null;try{saved=localStorage.getItem('apoya-skin')}catch(e){}
setSkin(SK.indexOf(saved)>=0?saved:'contorno');
document.getElementById('skins').addEventListener('click',function(e){var n=e.target.getAttribute&&e.target.getAttribute('data-skin');if(n)setSkin(n)});
var cb=document.getElementById('codebtn');
function toggleCodes(){var on=document.body.classList.toggle('codes');cb.textContent=on?'Ocultar códigos':'Ver códigos'}
cb.onclick=toggleCodes;
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key=='p'||e.key=='P'){setSkin(SK[(SK.indexOf(document.documentElement.getAttribute('data-skin'))+1)%3])}
 if(e.key=='c'||e.key=='C'){toggleCodes()}});
</script>
